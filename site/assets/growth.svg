<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">成长：让经历回到认知</title><desc id="desc">认知、选择、行动、复盘构成成长循环；健康、时间与关系构成生活的底座。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#72766c"/></marker></defs><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#292e29}.small{font-size:22px;fill:#72766c}.label{font-size:29px}.big{font-size:40px;font-family:'Songti SC',serif}.num{font-size:17px;fill:#72766c;letter-spacing:2px}.rule{fill:none;stroke:#c8cdbe;stroke-width:2}</style>
<text x="50" y="55" class="num">03 / MIND &amp; TIME</text><text x="50" y="112" class="big">把经历，变成下一步的选择。</text>
